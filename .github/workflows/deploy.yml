name: CI/CD - Déploiement production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installation des dépendances
        run: pip install -r requirements.txt pytest

      - name: Vérification syntaxe PHP
        run: find app public -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Tests unitaires
        run: python -m pytest -v

  deployer:
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/site-astrologie
            git pull origin main
            venv/bin/pip install -r requirements.txt
            systemctl restart astro-api
            systemctl reload nginx
