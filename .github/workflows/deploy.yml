name: CI/CD - Déploiement production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification syntaxe Python
        run: python3 -m py_compile astro_api.py

      - name: Vérification syntaxe PHP
        run: find app public -name "*.php" -print0 | xargs -0 -n1 php -l

  deployer:
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /var/www/site-astrologie
            git pull origin main
            venv/bin/pip install -r requirements.txt
            systemctl restart astro-api
            systemctl reload nginx
